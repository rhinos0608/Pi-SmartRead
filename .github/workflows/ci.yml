name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --fetch-retries=5 --fetch-timeout=600000
      - name: Install ripgrep (external grep comparator lexical floor)
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then exit 0; fi
          case "${RUNNER_OS}" in
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y ;;
          esac
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
